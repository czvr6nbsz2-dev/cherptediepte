<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ScD Calc">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Scherptediepte Calculator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0e0e;
  --bg2: #1a1a1a;
  --bg3: #242424;
  --amber: #c8922a;
  --amber-dim: #8a6520;
  --amber-glow: rgba(200,146,42,0.15);
  --text: #e8e0d4;
  --text-dim: #8a8278;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Menlo', 'Consolas', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --radius: 10px;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.3;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overflow-x: hidden;
  height: 100dvh;
  overflow-y: hidden;
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 8px 12px 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

h1 {
  font-size: 0.85rem;
  text-align: center;
  color: var(--amber);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 8px;
  font-weight: 500;
  flex-shrink: 0;
}

/* Selector pills */
.selector-group { margin-bottom: 8px; flex-shrink: 0; }
.selector-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.pill-row {
  display: flex;
  gap: 0;
  background: var(--bg2);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid #2a2a2a;
}
.pill-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--sans);
  font-size: 0.78rem;
  padding: 7px 4px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pill-btn.active {
  background: var(--bg3);
  color: var(--amber);
  box-shadow: inset 0 0 0 1px var(--amber-dim);
}

/* Lens selector as scrollable list */
.lens-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #2a2a2a;
  overflow: hidden;
  max-height: 160px;
  overflow-y: auto;
}
.lens-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--sans);
  font-size: 0.85rem;
  padding: 8px 10px;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lens-btn .mount-tag {
  font-size: 0.6rem;
  color: var(--amber-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  flex-shrink: 0;
  margin-left: 6px;
}
.lens-btn.active {
  background: var(--bg3);
  color: var(--amber);
}

/* Zoom slider */
.zoom-container {
  margin-top: 6px;
  padding: 7px 10px;
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #2a2a2a;
  display: none;
}
.zoom-container.visible { display: block; }
.zoom-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}
.zoom-value {
  font-family: var(--mono);
  color: var(--amber);
}
.zoom-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  outline: none;
}
.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--amber);
  border: 2px solid var(--bg);
  cursor: pointer;
}

/* Horizontal aperture strip */
.wheel-section {
  margin: 10px 0 8px;
  flex-shrink: 0;
}
.aperture-display {
  text-align: center;
  margin-bottom: 6px;
}
.aperture-value {
  font-family: var(--mono);
  font-size: 1.6rem;
  color: var(--amber);
  font-weight: 600;
}
.aperture-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-dim);
}
.strip-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.strip-container {
  flex: 1;
  overflow: hidden;
  position: relative;
  height: 52px;
  touch-action: none;
}
.strip-track {
  position: absolute;
  top: 0;
  height: 100%;
  display: flex;
  align-items: center;
  transition: transform 0.15s ease-out;
  will-change: transform;
}
.strip-stop {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 48px;
  flex-shrink: 0;
  cursor: pointer;
  height: 100%;
}
.strip-tick {
  width: 2px;
  height: 18px;
  background: var(--text-dim);
  border-radius: 1px;
  transition: all 0.15s;
}
.strip-stop.active .strip-tick {
  background: var(--amber);
  height: 24px;
  width: 3px;
}
.strip-stop-label {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--text-dim);
  margin-top: 3px;
  transition: all 0.15s;
}
.strip-stop.active .strip-stop-label {
  color: var(--amber);
  font-weight: 700;
  font-size: 0.72rem;
}
/* Center indicator line */
.strip-container::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--amber);
  z-index: 2;
  opacity: 0.4;
  transform: translateX(-50%);
}
.arrow-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid #2a2a2a;
  background: var(--bg2);
  color: var(--amber);
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
  flex-shrink: 0;
}
.arrow-btn:active { background: var(--bg3); }

/* Readout panels */
.panels {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  min-height: 0;
}
.panel {
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #2a2a2a;
  padding: 8px 10px;
  position: relative;
  overflow: hidden;
}
.panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--amber-dim), transparent);
}
.panel-title {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.panel-line {
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--text);
  margin-bottom: 2px;
  transition: opacity 0.3s;
}
.panel-line .val {
  color: var(--amber);
  font-weight: 600;
}

/* Scrollbar */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }
</style>
</head>
<body>
<div class="container">
  <h1>Scherptediepte</h1>

  <!-- Camera body selector -->
  <div class="selector-group">
    <div class="selector-label">Camera</div>
    <div class="pill-row" id="bodySelector"></div>
  </div>

  <!-- Lens selector -->
  <div class="selector-group">
    <div class="selector-label">Objectief</div>
    <div class="lens-list" id="lensSelector"></div>
  </div>

  <!-- Zoom slider -->
  <div class="zoom-container" id="zoomContainer">
    <div class="zoom-label">
      <span>Brandpuntsafstand</span>
      <span class="zoom-value" id="zoomValue">24 mm</span>
    </div>
    <input type="range" class="zoom-slider" id="zoomSlider">
  </div>

  <!-- Aperture horizontal strip -->
  <div class="wheel-section">
    <div class="aperture-display">
      <div class="aperture-value" id="apertureValue">f/4</div>
      <div class="aperture-label">diafragma</div>
    </div>
    <div class="strip-row">
      <button class="arrow-btn" id="arrowLeft">‹</button>
      <div class="strip-container" id="stripContainer">
        <div class="strip-track" id="stripTrack"></div>
      </div>
      <button class="arrow-btn" id="arrowRight">›</button>
    </div>
  </div>

  <!-- Readout panels -->
  <div class="panels">
    <div class="panel">
      <div class="panel-title">Hyperfocale afstand</div>
      <div class="panel-line" id="hyper1"></div>
      <div class="panel-line" id="hyper2"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Scherpstelling 5 m</div>
      <div class="panel-line" id="focus5"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Scherpstelling 2 m</div>
      <div class="panel-line" id="focus2"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Scherpstelling 1 m</div>
      <div class="panel-line" id="focus1"></div>
    </div>
  </div>
</div>

<script>
// ── Data ──
const ALL_STOPS = [1.0, 1.2, 1.4, 1.8, 2.0, 2.8, 4, 5.6, 8, 11, 16, 22];

const bodies = [
  { name: 'Nikon Z6 III', coc: 0.030 },
  { name: 'Nikon D700', coc: 0.030 }
];

const lenses = {
  'Nikon Z6 III': [
    { name: 'Laowa 11mm f/4', mount: 'Z', focal: 11, maxAp: 4 },
    { name: 'Nikkor Z 24–120mm f/4', mount: 'Z', focal: [24,120], maxAp: 4 },
    { name: 'Nikkor Z 100–400mm f/4.5–5.6', mount: 'Z', focal: [100,400], maxAp: [4.5, 6.3] },
    { name: 'Nikkor 35mm f/1.4G', mount: 'F', focal: 35, maxAp: 1.4 },
    { name: 'Nikkor 35mm f/2 AI', mount: 'F', focal: 35, maxAp: 2.0 },
    { name: 'Nikkor 50mm f/1.4 AI', mount: 'F', focal: 50, maxAp: 1.4 },
    { name: 'Nikkor 85mm f/2 AI', mount: 'F', focal: 85, maxAp: 2.0 },
    { name: 'Orestegon 29mm f/2.8', mount: 'M42', focal: 29, maxAp: 2.8 }
  ],
  'Nikon D700': [
    { name: 'Nikkor 35mm f/1.4G', mount: 'F', focal: 35, maxAp: 1.4 },
    { name: 'Nikkor 35mm f/2 AI', mount: 'F', focal: 35, maxAp: 2.0 },
    { name: 'Nikkor 50mm f/1.4 AI', mount: 'F', focal: 50, maxAp: 1.4 },
    { name: 'Nikkor 85mm f/2 AI', mount: 'F', focal: 85, maxAp: 2.0 }
  ]
};

// ── State ──
let currentBody = 0;
let currentLens = 0;
let currentStopIndex = 0;
let availableStops = [];
let currentFocal = 0;
let currentMaxAp = 0;
let dragXStart = null;
let dragStopStart = null;
const STOP_WIDTH = 48;

// ── DOM refs ──
const bodySelector = document.getElementById('bodySelector');
const lensSelector = document.getElementById('lensSelector');
const zoomContainer = document.getElementById('zoomContainer');
const zoomSlider = document.getElementById('zoomSlider');
const zoomValue = document.getElementById('zoomValue');
const stripContainer = document.getElementById('stripContainer');
const stripTrack = document.getElementById('stripTrack');
const apertureValue = document.getElementById('apertureValue');

// ── Init ──
function init() {
  renderBodies();
  selectBody(0);
}

function renderBodies() {
  bodySelector.innerHTML = bodies.map((b, i) =>
    `<button class="pill-btn${i === currentBody ? ' active' : ''}" data-i="${i}">${b.name}</button>`
  ).join('');
  bodySelector.querySelectorAll('.pill-btn').forEach(btn => {
    btn.addEventListener('click', () => selectBody(+btn.dataset.i));
  });
}

function selectBody(i) {
  currentBody = i;
  bodySelector.querySelectorAll('.pill-btn').forEach((b, j) => b.classList.toggle('active', j === i));
  currentLens = 0;
  renderLenses();
  selectLens(0);
}

function renderLenses() {
  const list = lenses[bodies[currentBody].name];
  lensSelector.innerHTML = list.map((l, i) =>
    `<button class="lens-btn${i === currentLens ? ' active' : ''}" data-i="${i}">
      <span>${l.name}</span>
      <span class="mount-tag">${l.mount}</span>
    </button>`
  ).join('');
  lensSelector.querySelectorAll('.lens-btn').forEach(btn => {
    btn.addEventListener('click', () => selectLens(+btn.dataset.i));
  });
}

function selectLens(i) {
  currentLens = i;
  lensSelector.querySelectorAll('.lens-btn').forEach((b, j) => b.classList.toggle('active', j === i));
  const lens = lenses[bodies[currentBody].name][i];
  const isZoom = Array.isArray(lens.focal);

  if (isZoom) {
    zoomContainer.classList.add('visible');
    zoomSlider.min = lens.focal[0];
    zoomSlider.max = lens.focal[1];
    zoomSlider.value = lens.focal[0];
    currentFocal = lens.focal[0];
    updateZoomDisplay();
  } else {
    zoomContainer.classList.remove('visible');
    currentFocal = lens.focal;
  }

  updateMaxAperture();
  updateAvailableStops();
  renderStrip();
  calculate();
}

function updateMaxAperture() {
  const lens = lenses[bodies[currentBody].name][currentLens];
  if (Array.isArray(lens.maxAp)) {
    const [fMin, fMax] = lens.focal;
    const [apMin, apMax] = lens.maxAp;
    const t = Math.log(currentFocal / fMin) / Math.log(fMax / fMin);
    currentMaxAp = apMin * Math.pow(apMax / apMin, t);
  } else {
    currentMaxAp = lens.maxAp;
  }
}

function updateZoomDisplay() {
  zoomValue.textContent = currentFocal + ' mm';
}

function updateAvailableStops() {
  availableStops = ALL_STOPS.filter(s => s >= currentMaxAp - 0.01);
  if (currentStopIndex >= availableStops.length) currentStopIndex = availableStops.length - 1;
  if (currentStopIndex < 0) currentStopIndex = 0;
}

// Zoom slider
zoomSlider.addEventListener('input', () => {
  currentFocal = +zoomSlider.value;
  updateZoomDisplay();
  updateMaxAperture();
  updateAvailableStops();
  renderStrip();
  calculate();
});

// ── Horizontal Aperture Strip ──
function renderStrip() {
  stripTrack.innerHTML = availableStops.map((stop, i) => {
    const label = stop % 1 === 0 ? stop : stop.toFixed(1);
    return `<div class="strip-stop${i === currentStopIndex ? ' active' : ''}" data-i="${i}">
      <div class="strip-tick"></div>
      <div class="strip-stop-label">${label}</div>
    </div>`;
  }).join('');

  // Click on stops
  stripTrack.querySelectorAll('.strip-stop').forEach(el => {
    el.addEventListener('click', () => {
      currentStopIndex = +el.dataset.i;
      renderStrip();
      calculate();
    });
  });

  updateStripPosition(false);
  updateApertureDisplay();
}

function updateStripPosition(animate) {
  const containerWidth = stripContainer.offsetWidth;
  const offset = containerWidth / 2 - currentStopIndex * STOP_WIDTH - STOP_WIDTH / 2;
  stripTrack.style.transition = animate ? 'transform 0.15s ease-out' : 'none';
  stripTrack.style.transform = `translateX(${offset}px)`;
}

function updateApertureDisplay() {
  const apVal = availableStops[currentStopIndex];
  apertureValue.textContent = apVal % 1 === 0 ? `f/${apVal}` : `f/${apVal.toFixed(1)}`;
}

// Arrow buttons
document.getElementById('arrowLeft').addEventListener('click', () => {
  if (currentStopIndex > 0) {
    currentStopIndex--;
    renderStrip();
    updateStripPosition(true);
    calculate();
  }
});
document.getElementById('arrowRight').addEventListener('click', () => {
  if (currentStopIndex < availableStops.length - 1) {
    currentStopIndex++;
    renderStrip();
    updateStripPosition(true);
    calculate();
  }
});

// Touch/mouse drag on strip
(function() {
  const el = stripContainer;

  function getX(e) {
    return e.touches ? e.touches[0].clientX : e.clientX;
  }

  function onStart(e) {
    dragXStart = getX(e);
    dragStopStart = currentStopIndex;
    stripTrack.style.transition = 'none';
    e.preventDefault();
  }

  function onMove(e) {
    if (dragXStart === null) return;
    const dx = getX(e) - dragXStart;
    const stepsChange = Math.round(-dx / STOP_WIDTH);
    let newIndex = dragStopStart + stepsChange;
    newIndex = Math.max(0, Math.min(availableStops.length - 1, newIndex));

    if (newIndex !== currentStopIndex) {
      currentStopIndex = newIndex;
      // Update active classes
      stripTrack.querySelectorAll('.strip-stop').forEach((s, i) => s.classList.toggle('active', i === currentStopIndex));
      updateStripPosition(false);
      updateApertureDisplay();
      calculate();
    }
    e.preventDefault();
  }

  function onEnd() {
    if (dragXStart !== null) {
      updateStripPosition(true);
    }
    dragXStart = null;
    dragStopStart = null;
  }

  el.addEventListener('mousedown', onStart);
  el.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
})();

// ── DOF Calculations ──
function calculate() {
  const coc = bodies[currentBody].coc;
  const f = currentFocal;
  const N = availableStops[currentStopIndex];

  const H_mm = (f * f) / (N * coc) + f;
  const H = H_mm / 1000;

  document.getElementById('hyper1').innerHTML =
    `Stel scherp op <span class="val">${H.toFixed(2)} m</span>`;
  document.getElementById('hyper2').innerHTML =
    `Scherp van <span class="val">${(H / 2).toFixed(2)} m</span> tot <span class="val">∞</span>`;

  document.getElementById('focus5').innerHTML = dofLine(H, 5);
  document.getElementById('focus2').innerHTML = dofLine(H, 2);
  document.getElementById('focus1').innerHTML = dofLine(H, 1);
}

function dofLine(H, d) {
  const near = (H * d) / (H + d);
  let far;
  if (d >= H) {
    far = '∞';
  } else {
    const farVal = (H * d) / (H - d);
    far = farVal >= H ? '∞' : farVal.toFixed(2) + ' m';
  }
  return `<span class="val">${near.toFixed(2)}</span> – <span class="val">${far}</span>`;
}

// ── Service Worker ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

// ── Start ──
init();
// Recalculate strip position after layout settles
requestAnimationFrame(() => updateStripPosition(false));
</script>
</body>
</html>
