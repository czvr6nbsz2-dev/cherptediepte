<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ScD Calc">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Scherptediepte Calculator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0e0e;
  --bg2: #1a1a1a;
  --bg3: #242424;
  --amber: #c8922a;
  --amber-dim: #8a6520;
  --text: #e8e0d4;
  --text-dim: #8a8278;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Menlo', 'Consolas', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --radius: 10px;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.3;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overflow-x: hidden;
  height: 100dvh;
  overflow-y: hidden;
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 8px 12px 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* Tabs */
.tab-bar {
  display: flex;
  gap: 0;
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #2a2a2a;
  overflow: hidden;
  margin-bottom: 8px;
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--sans);
  font-size: 0.78rem;
  padding: 9px 4px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.tab-btn.active {
  background: var(--bg3);
  color: var(--amber);
  box-shadow: inset 0 0 0 1px var(--amber-dim);
}
.tab-page { display: none; flex-direction: column; flex: 1; min-height: 0; }
.tab-page.active { display: flex; }

/* Selector group */
.selector-group { margin-bottom: 8px; flex-shrink: 0; }
.selector-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  margin-bottom: 4px;
}

/* Lens selector */
.lens-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #2a2a2a;
  overflow: hidden;
  max-height: 160px;
  overflow-y: auto;
}
.lens-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--sans);
  font-size: 0.85rem;
  padding: 8px 10px;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lens-btn .mount-tag {
  font-size: 0.6rem;
  color: var(--amber-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  flex-shrink: 0;
  margin-left: 6px;
}
.lens-btn.active {
  background: var(--bg3);
  color: var(--amber);
}

/* Zoom slider */
.zoom-container {
  margin-top: 6px;
  padding: 7px 10px;
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #2a2a2a;
  display: none;
}
.zoom-container.visible { display: block; }
.zoom-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}
.zoom-value {
  font-family: var(--mono);
  color: var(--amber);
}
.zoom-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  outline: none;
}
.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--amber);
  border: 2px solid var(--bg);
  cursor: pointer;
}

/* Horizontal strips */
.strip-section {
  margin: 6px 0;
  flex-shrink: 0;
}
.strip-header {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  margin-bottom: 4px;
}
.strip-value {
  font-family: var(--mono);
  font-size: 1.4rem;
  color: var(--amber);
  font-weight: 600;
}
.strip-label {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
}
.strip-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.strip-container {
  flex: 1;
  overflow: hidden;
  position: relative;
  height: 46px;
  touch-action: none;
}
.strip-track {
  position: absolute;
  top: 0;
  height: 100%;
  display: flex;
  align-items: center;
  transition: transform 0.15s ease-out;
  will-change: transform;
}
.strip-stop {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 48px;
  flex-shrink: 0;
  cursor: pointer;
  height: 100%;
}
.strip-tick {
  width: 2px;
  height: 16px;
  background: var(--text-dim);
  border-radius: 1px;
  transition: all 0.15s;
}
.strip-stop.active .strip-tick {
  background: var(--amber);
  height: 22px;
  width: 3px;
}
.strip-stop-label {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--text-dim);
  margin-top: 2px;
  transition: all 0.15s;
  white-space: nowrap;
}
.strip-stop.active .strip-stop-label {
  color: var(--amber);
  font-weight: 700;
  font-size: 0.66rem;
}
.strip-container::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--amber);
  z-index: 2;
  opacity: 0.4;
  transform: translateX(-50%);
}
.arrow-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid #2a2a2a;
  background: var(--bg2);
  color: var(--amber);
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
  flex-shrink: 0;
}
.arrow-btn:active { background: var(--bg3); }

/* Readout panels */
.panels {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
  min-height: 0;
}
.panel {
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #2a2a2a;
  padding: 7px 10px;
  position: relative;
  overflow: hidden;
}
.panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--amber-dim), transparent);
}
.panel-title {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 3px;
}
.panel-line {
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--text);
  margin-bottom: 1px;
  transition: opacity 0.3s;
}
.panel-line .val {
  color: var(--amber);
  font-weight: 600;
}

/* Light meter result */
.meter-result {
  text-align: center;
  padding: 16px 10px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.meter-result-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.meter-result-value {
  font-family: var(--mono);
  font-size: 2.4rem;
  color: var(--amber);
  font-weight: 700;
}
.meter-result-sub {
  font-family: var(--mono);
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-top: 6px;
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }
</style>
</head>
<body>
<div class="container">
  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="dof">Scherptediepte</button>
    <button class="tab-btn" data-tab="meter">Lichtmeting</button>
  </div>

  <!-- DOF tab -->
  <div class="tab-page active" id="tab-dof">
    <div class="selector-group">
      <div class="selector-label">Objectief</div>
      <div class="lens-list" id="lensSelector"></div>
    </div>
    <div class="zoom-container" id="zoomContainer">
      <div class="zoom-label">
        <span>Brandpuntsafstand</span>
        <span class="zoom-value" id="zoomValue">24 mm</span>
      </div>
      <input type="range" class="zoom-slider" id="zoomSlider">
    </div>
    <div class="strip-section">
      <div class="strip-header">
        <span class="strip-value" id="apertureValue">f/4</span>
        <span class="strip-label">diafragma</span>
      </div>
      <div class="strip-row">
        <button class="arrow-btn" id="apLeft">&#8249;</button>
        <div class="strip-container" id="apContainer">
          <div class="strip-track" id="apTrack"></div>
        </div>
        <button class="arrow-btn" id="apRight">&#8250;</button>
      </div>
    </div>
    <div class="strip-section">
      <div class="strip-header">
        <span class="strip-value" id="distValue">5.0 m</span>
        <span class="strip-label">scherpstelafstand</span>
      </div>
      <div class="strip-row">
        <button class="arrow-btn" id="distLeft">&#8249;</button>
        <div class="strip-container" id="distContainer">
          <div class="strip-track" id="distTrack"></div>
        </div>
        <button class="arrow-btn" id="distRight">&#8250;</button>
      </div>
    </div>
    <div class="panels">
      <div class="panel">
        <div class="panel-title">Hyperfocale afstand</div>
        <div class="panel-line" id="hyper1"></div>
        <div class="panel-line" id="hyper2"></div>
      </div>
      <div class="panel">
        <div class="panel-title" id="customTitle">Scherpstelling op 5.0 m</div>
        <div class="panel-line" id="focusCustom"></div>
      </div>
    </div>
  </div>

  <!-- Light meter tab -->
  <div class="tab-page" id="tab-meter">
    <div class="strip-section">
      <div class="strip-header">
        <span class="strip-value" id="mApValue">f/4</span>
        <span class="strip-label">diafragma</span>
      </div>
      <div class="strip-row">
        <button class="arrow-btn" id="mApLeft">&#8249;</button>
        <div class="strip-container" id="mApContainer">
          <div class="strip-track" id="mApTrack"></div>
        </div>
        <button class="arrow-btn" id="mApRight">&#8250;</button>
      </div>
    </div>
    <div class="strip-section">
      <div class="strip-header">
        <span class="strip-value" id="isoValue">ISO 100</span>
        <span class="strip-label">gevoeligheid</span>
      </div>
      <div class="strip-row">
        <button class="arrow-btn" id="isoLeft">&#8249;</button>
        <div class="strip-container" id="isoContainer">
          <div class="strip-track" id="isoTrack"></div>
        </div>
        <button class="arrow-btn" id="isoRight">&#8250;</button>
      </div>
    </div>
    <div class="strip-section">
      <div class="strip-header">
        <span class="strip-value" id="evValue">EV 10</span>
        <span class="strip-label">lichtwaarde</span>
      </div>
      <div class="strip-row">
        <button class="arrow-btn" id="evLeft">&#8249;</button>
        <div class="strip-container" id="evContainer">
          <div class="strip-track" id="evTrack"></div>
        </div>
        <button class="arrow-btn" id="evRight">&#8250;</button>
      </div>
    </div>
    <div class="meter-result">
      <div class="meter-result-label">Sluitertijd</div>
      <div class="meter-result-value" id="shutterValue">1/60</div>
      <div class="meter-result-sub" id="shutterSub"></div>
    </div>
  </div>
</div>

<script>
// ── Constants ──
const COC = 0.030;
const ALL_STOPS = [1.0, 1.2, 1.4, 1.8, 2.0, 2.8, 4, 5.6, 8, 11, 16, 22];
const DIST_STOPS = [0.3, 0.5, 0.7, 1, 1.5, 2, 2.5, 3, 5, 7, 10, 15, 20, 30, 50, 100];
const ISO_STOPS = [50, 100, 200, 400, 800, 1600, 3200, 6400, 12800, 25600];
const EV_STOPS = [];
for (let i = -2; i <= 20; i++) EV_STOPS.push(i);
const STOP_WIDTH = 48;

const allLenses = [
  { name: 'Laowa 11mm f/4', mount: 'Z', focal: 11, maxAp: 4 },
  { name: 'Nikkor Z 24\u2013120mm f/4', mount: 'Z', focal: [24,120], maxAp: 4 },
  { name: 'Nikkor Z 100\u2013400mm f/4.5\u20135.6', mount: 'Z', focal: [100,400], maxAp: [4.5, 6.3] },
  { name: 'Orestegon 29mm f/2.8', mount: 'M42', focal: 29, maxAp: 2.8 },
  { name: 'Nikkor 35mm f/1.4G', mount: 'F', focal: 35, maxAp: 1.4 },
  { name: 'Nikkor 35mm f/2 AI', mount: 'F', focal: 35, maxAp: 2.0 },
  { name: 'Nikkor 50mm f/1.4 AI', mount: 'F', focal: 50, maxAp: 1.4 },
  { name: 'Nikkor 85mm f/2 AI', mount: 'F', focal: 85, maxAp: 2.0 },
];

// ── State (with localStorage persistence) ──
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('scd_state'));
    if (s) return s;
  } catch(e) {}
  return {};
}
function saveState() {
  localStorage.setItem('scd_state', JSON.stringify({
    tab: activeTab,
    lens: currentLens,
    apIdx: currentStopIndex,
    distIdx: currentDistIndex,
    zoom: currentFocal,
    mApIdx: mApIndex,
    isoIdx: isoIndex,
    evIdx: evIndex,
  }));
}
const saved = loadState();

let activeTab = saved.tab || 'dof';
let currentLens = saved.lens ?? 0;
let currentStopIndex = saved.apIdx ?? 0;
let currentDistIndex = saved.distIdx ?? 5;
let currentFocal = saved.zoom ?? 0;
let currentMaxAp = 0;
let availableStops = [];

// Light meter state
let mApIndex = saved.mApIdx ?? 6; // f/4
let isoIndex = saved.isoIdx ?? 1; // ISO 100
let evIndex = saved.evIdx ?? 12;  // EV 10

// ── Tabs ──
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
    document.querySelectorAll('.tab-page').forEach(p => p.classList.toggle('active', p.id === 'tab-' + activeTab));
    if (activeTab === 'meter') {
      requestAnimationFrame(() => { updateMApPos(false); updateIsoPos(false); updateEvPos(false); });
    } else {
      requestAnimationFrame(() => { updateApPos(false); updateDistPos(false); });
    }
    saveState();
  });
});

// Set initial tab
document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
document.querySelectorAll('.tab-page').forEach(p => p.classList.toggle('active', p.id === 'tab-' + activeTab));

// ── DOF Tab ──
const lensSelector = document.getElementById('lensSelector');
const zoomContainer = document.getElementById('zoomContainer');
const zoomSlider = document.getElementById('zoomSlider');
const zoomValue = document.getElementById('zoomValue');
const apContainer = document.getElementById('apContainer');
const apTrack = document.getElementById('apTrack');
const apertureValue = document.getElementById('apertureValue');
const distContainer = document.getElementById('distContainer');
const distTrack = document.getElementById('distTrack');
const distValueEl = document.getElementById('distValue');

function initDof() {
  renderLenses();
  selectLens(currentLens, true);
  renderDistStrip();
}

function renderLenses() {
  lensSelector.innerHTML = allLenses.map((l, i) =>
    `<button class="lens-btn${i === currentLens ? ' active' : ''}" data-i="${i}">
      <span>${l.name}</span>
      <span class="mount-tag">${l.mount}</span>
    </button>`
  ).join('');
  lensSelector.querySelectorAll('.lens-btn').forEach(btn => {
    btn.addEventListener('click', () => selectLens(+btn.dataset.i, false));
  });
}

function selectLens(i, restoring) {
  currentLens = i;
  lensSelector.querySelectorAll('.lens-btn').forEach((b, j) => b.classList.toggle('active', j === i));
  const lens = allLenses[i];
  const isZoom = Array.isArray(lens.focal);

  if (isZoom) {
    zoomContainer.classList.add('visible');
    zoomSlider.min = lens.focal[0];
    zoomSlider.max = lens.focal[1];
    if (restoring && currentFocal >= lens.focal[0] && currentFocal <= lens.focal[1]) {
      zoomSlider.value = currentFocal;
    } else {
      currentFocal = lens.focal[0];
      zoomSlider.value = currentFocal;
    }
    updateZoomDisplay();
  } else {
    zoomContainer.classList.remove('visible');
    currentFocal = lens.focal;
  }

  updateMaxAperture();
  updateAvailableStops();
  renderApStrip();
  calculateDof();
  saveState();
}

function updateMaxAperture() {
  const lens = allLenses[currentLens];
  if (Array.isArray(lens.maxAp)) {
    const [fMin, fMax] = lens.focal;
    const [apMin, apMax] = lens.maxAp;
    const t = Math.log(currentFocal / fMin) / Math.log(fMax / fMin);
    currentMaxAp = apMin * Math.pow(apMax / apMin, t);
  } else {
    currentMaxAp = lens.maxAp;
  }
}

function updateZoomDisplay() { zoomValue.textContent = Math.round(currentFocal) + ' mm'; }

function updateAvailableStops() {
  availableStops = ALL_STOPS.filter(s => s >= currentMaxAp - 0.01);
  if (currentStopIndex >= availableStops.length) currentStopIndex = availableStops.length - 1;
  if (currentStopIndex < 0) currentStopIndex = 0;
}

zoomSlider.addEventListener('input', () => {
  currentFocal = +zoomSlider.value;
  updateZoomDisplay();
  updateMaxAperture();
  updateAvailableStops();
  renderApStrip();
  calculateDof();
  saveState();
});

// Aperture strip
function renderApStrip() {
  const idx = currentStopIndex;
  apTrack.innerHTML = availableStops.map((s, i) => {
    const label = s % 1 === 0 ? s : s.toFixed(1);
    return `<div class="strip-stop${i === idx ? ' active' : ''}" data-i="${i}">
      <div class="strip-tick"></div>
      <div class="strip-stop-label">${label}</div>
    </div>`;
  }).join('');
  apTrack.querySelectorAll('.strip-stop').forEach(el => {
    el.addEventListener('click', () => { currentStopIndex = +el.dataset.i; renderApStrip(); calculateDof(); saveState(); });
  });
  updateApPos(false);
  const v = availableStops[currentStopIndex];
  apertureValue.textContent = v % 1 === 0 ? `f/${v}` : `f/${v.toFixed(1)}`;
}

function updateApPos(animate) {
  const w = apContainer.offsetWidth;
  const offset = w / 2 - currentStopIndex * STOP_WIDTH - STOP_WIDTH / 2;
  apTrack.style.transition = animate ? 'transform 0.15s ease-out' : 'none';
  apTrack.style.transform = `translateX(${offset}px)`;
}

makeDraggable(apContainer, apTrack,
  () => currentStopIndex, i => { currentStopIndex = i; },
  () => availableStops.length,
  () => { renderApStrip(); calculateDof(); saveState(); },
  () => updateApPos(false),
  () => updateApPos(true)
);
makeArrows('apLeft', 'apRight',
  () => currentStopIndex, i => { currentStopIndex = i; },
  () => availableStops.length,
  () => { renderApStrip(); updateApPos(true); calculateDof(); saveState(); }
);

// Distance strip
function formatDist(d) { return d >= 1 ? (d % 1 === 0 ? d + '' : d.toFixed(1)) : d.toFixed(1); }

function renderDistStrip() {
  const idx = currentDistIndex;
  distTrack.innerHTML = DIST_STOPS.map((d, i) =>
    `<div class="strip-stop${i === idx ? ' active' : ''}" data-i="${i}">
      <div class="strip-tick"></div>
      <div class="strip-stop-label">${formatDist(d)}</div>
    </div>`
  ).join('');
  distTrack.querySelectorAll('.strip-stop').forEach(el => {
    el.addEventListener('click', () => { currentDistIndex = +el.dataset.i; renderDistStrip(); calculateDof(); saveState(); });
  });
  updateDistPos(false);
  distValueEl.textContent = formatDist(DIST_STOPS[currentDistIndex]) + ' m';
}

function updateDistPos(animate) {
  const w = distContainer.offsetWidth;
  const offset = w / 2 - currentDistIndex * STOP_WIDTH - STOP_WIDTH / 2;
  distTrack.style.transition = animate ? 'transform 0.15s ease-out' : 'none';
  distTrack.style.transform = `translateX(${offset}px)`;
}

makeDraggable(distContainer, distTrack,
  () => currentDistIndex, i => { currentDistIndex = i; },
  () => DIST_STOPS.length,
  () => { renderDistStrip(); calculateDof(); saveState(); },
  () => updateDistPos(false),
  () => updateDistPos(true)
);
makeArrows('distLeft', 'distRight',
  () => currentDistIndex, i => { currentDistIndex = i; },
  () => DIST_STOPS.length,
  () => { renderDistStrip(); updateDistPos(true); calculateDof(); saveState(); }
);

function calculateDof() {
  const f = currentFocal;
  const N = availableStops[currentStopIndex];
  const H_mm = (f * f) / (N * COC) + f;
  const H = H_mm / 1000;

  document.getElementById('hyper1').innerHTML =
    `Stel scherp op <span class="val">${H.toFixed(2)} m</span>`;
  document.getElementById('hyper2').innerHTML =
    `Scherp van <span class="val">${(H / 2).toFixed(2)} m</span> tot <span class="val">\u221E</span>`;

  const d = DIST_STOPS[currentDistIndex];
  document.getElementById('customTitle').textContent = `Scherpstelling op ${formatDist(d)} m`;
  document.getElementById('focusCustom').innerHTML = dofLine(H, d);
}

function dofLine(H, d) {
  const near = (H * d) / (H + d);
  let far;
  if (d >= H) { far = '\u221E'; }
  else {
    const fv = (H * d) / (H - d);
    far = fv >= H ? '\u221E' : fv.toFixed(2) + ' m';
  }
  return `<span class="val">${near.toFixed(2)} m</span> \u2013 <span class="val">${far}</span>`;
}

// ── Light Meter Tab ──
const mApContainer = document.getElementById('mApContainer');
const mApTrack = document.getElementById('mApTrack');
const mApValueEl = document.getElementById('mApValue');
const isoContainer = document.getElementById('isoContainer');
const isoTrack = document.getElementById('isoTrack');
const isoValueEl = document.getElementById('isoValue');
const evContainer = document.getElementById('evContainer');
const evTrack = document.getElementById('evTrack');
const evValueEl = document.getElementById('evValue');

function renderMApStrip() {
  mApTrack.innerHTML = ALL_STOPS.map((s, i) => {
    const label = s % 1 === 0 ? s : s.toFixed(1);
    return `<div class="strip-stop${i === mApIndex ? ' active' : ''}" data-i="${i}">
      <div class="strip-tick"></div>
      <div class="strip-stop-label">${label}</div>
    </div>`;
  }).join('');
  mApTrack.querySelectorAll('.strip-stop').forEach(el => {
    el.addEventListener('click', () => { mApIndex = +el.dataset.i; renderMApStrip(); calcMeter(); saveState(); });
  });
  updateMApPos(false);
  const v = ALL_STOPS[mApIndex];
  mApValueEl.textContent = v % 1 === 0 ? `f/${v}` : `f/${v.toFixed(1)}`;
}
function updateMApPos(animate) {
  const w = mApContainer.offsetWidth;
  mApTrack.style.transition = animate ? 'transform 0.15s ease-out' : 'none';
  mApTrack.style.transform = `translateX(${w / 2 - mApIndex * STOP_WIDTH - STOP_WIDTH / 2}px)`;
}
makeDraggable(mApContainer, mApTrack, () => mApIndex, i => { mApIndex = i; }, () => ALL_STOPS.length,
  () => { renderMApStrip(); calcMeter(); saveState(); }, () => updateMApPos(false), () => updateMApPos(true));
makeArrows('mApLeft', 'mApRight', () => mApIndex, i => { mApIndex = i; }, () => ALL_STOPS.length,
  () => { renderMApStrip(); updateMApPos(true); calcMeter(); saveState(); });

function renderIsoStrip() {
  isoTrack.innerHTML = ISO_STOPS.map((s, i) =>
    `<div class="strip-stop${i === isoIndex ? ' active' : ''}" data-i="${i}">
      <div class="strip-tick"></div>
      <div class="strip-stop-label">${s}</div>
    </div>`
  ).join('');
  isoTrack.querySelectorAll('.strip-stop').forEach(el => {
    el.addEventListener('click', () => { isoIndex = +el.dataset.i; renderIsoStrip(); calcMeter(); saveState(); });
  });
  updateIsoPos(false);
  isoValueEl.textContent = `ISO ${ISO_STOPS[isoIndex]}`;
}
function updateIsoPos(animate) {
  const w = isoContainer.offsetWidth;
  isoTrack.style.transition = animate ? 'transform 0.15s ease-out' : 'none';
  isoTrack.style.transform = `translateX(${w / 2 - isoIndex * STOP_WIDTH - STOP_WIDTH / 2}px)`;
}
makeDraggable(isoContainer, isoTrack, () => isoIndex, i => { isoIndex = i; }, () => ISO_STOPS.length,
  () => { renderIsoStrip(); calcMeter(); saveState(); }, () => updateIsoPos(false), () => updateIsoPos(true));
makeArrows('isoLeft', 'isoRight', () => isoIndex, i => { isoIndex = i; }, () => ISO_STOPS.length,
  () => { renderIsoStrip(); updateIsoPos(true); calcMeter(); saveState(); });

function renderEvStrip() {
  evTrack.innerHTML = EV_STOPS.map((s, i) =>
    `<div class="strip-stop${i === evIndex ? ' active' : ''}" data-i="${i}">
      <div class="strip-tick"></div>
      <div class="strip-stop-label">${s}</div>
    </div>`
  ).join('');
  evTrack.querySelectorAll('.strip-stop').forEach(el => {
    el.addEventListener('click', () => { evIndex = +el.dataset.i; renderEvStrip(); calcMeter(); saveState(); });
  });
  updateEvPos(false);
  evValueEl.textContent = `EV ${EV_STOPS[evIndex]}`;
}
function updateEvPos(animate) {
  const w = evContainer.offsetWidth;
  evTrack.style.transition = animate ? 'transform 0.15s ease-out' : 'none';
  evTrack.style.transform = `translateX(${w / 2 - evIndex * STOP_WIDTH - STOP_WIDTH / 2}px)`;
}
makeDraggable(evContainer, evTrack, () => evIndex, i => { evIndex = i; }, () => EV_STOPS.length,
  () => { renderEvStrip(); calcMeter(); saveState(); }, () => updateEvPos(false), () => updateEvPos(true));
makeArrows('evLeft', 'evRight', () => evIndex, i => { evIndex = i; }, () => EV_STOPS.length,
  () => { renderEvStrip(); updateEvPos(true); calcMeter(); saveState(); });

function calcMeter() {
  const N = ALL_STOPS[mApIndex];
  const iso = ISO_STOPS[isoIndex];
  const ev = EV_STOPS[evIndex];
  // EV at ISO 100 = AV + TV. Adjusted for ISO: TV = AV + log2(ISO/100) - EV
  // AV = log2(N^2), so t = N^2 / (2^EV * ISO/100)
  const t = (N * N) / (Math.pow(2, ev) * (iso / 100));
  document.getElementById('shutterValue').textContent = formatShutter(t);
  document.getElementById('shutterSub').textContent = `${t.toFixed(4)} s`;
}

function formatShutter(t) {
  if (t >= 60) {
    const m = Math.floor(t / 60);
    const s = Math.round(t % 60);
    return s > 0 ? `${m}m ${s}s` : `${m} min`;
  }
  if (t >= 1) return t < 10 ? t.toFixed(1) + ' s' : Math.round(t) + ' s';
  const inv = 1 / t;
  // Snap to nearest standard shutter speed
  const standards = [2, 4, 8, 15, 30, 60, 125, 250, 500, 1000, 2000, 4000, 8000];
  let best = standards[0];
  let bestDist = Math.abs(inv - best);
  for (const s of standards) {
    const d = Math.abs(inv - s);
    if (d < bestDist) { best = s; bestDist = d; }
  }
  // Only snap if within ~1/3 stop
  if (bestDist / inv < 0.3) return `1/${best}`;
  return `1/${Math.round(inv)}`;
}

// ── Shared drag/arrow helpers ──
function makeDraggable(container, track, getIdx, setIdx, getLen, onUpdate, posNoAnim, posAnim) {
  let dragX = null, dragStart = null;
  function getX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }
  function onStart(e) { dragX = getX(e); dragStart = getIdx(); track.style.transition = 'none'; e.preventDefault(); }
  function onMove(e) {
    if (dragX === null) return;
    const dx = getX(e) - dragX;
    let ni = Math.max(0, Math.min(getLen() - 1, dragStart + Math.round(-dx / STOP_WIDTH)));
    if (ni !== getIdx()) {
      setIdx(ni);
      track.querySelectorAll('.strip-stop').forEach((s, i) => s.classList.toggle('active', i === ni));
      posNoAnim();
      onUpdate();
    }
    e.preventDefault();
  }
  function onEnd() { if (dragX !== null) posAnim(); dragX = null; }
  container.addEventListener('mousedown', onStart);
  container.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
}

function makeArrows(leftId, rightId, getIdx, setIdx, getLen, onUpdate) {
  document.getElementById(leftId).addEventListener('click', () => {
    if (getIdx() > 0) { setIdx(getIdx() - 1); onUpdate(); }
  });
  document.getElementById(rightId).addEventListener('click', () => {
    if (getIdx() < getLen() - 1) { setIdx(getIdx() + 1); onUpdate(); }
  });
}

// ── Service Worker ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

// ── Start ──
initDof();
renderMApStrip();
renderIsoStrip();
renderEvStrip();
calcMeter();
requestAnimationFrame(() => {
  if (activeTab === 'dof') { updateApPos(false); updateDistPos(false); }
  else { updateMApPos(false); updateIsoPos(false); updateEvPos(false); }
});
</script>
