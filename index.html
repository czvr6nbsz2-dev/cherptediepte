<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ScD Calc">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Scherptediepte Calculator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0e0e;
  --bg2: #1a1a1a;
  --bg3: #242424;
  --amber: #c8922a;
  --amber-dim: #8a6520;
  --amber-glow: rgba(200,146,42,0.15);
  --text: #e8e0d4;
  --text-dim: #8a8278;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Menlo', 'Consolas', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --radius: 12px;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overflow-x: hidden;
  min-height: 100dvh;
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 16px 16px 40px;
}

h1 {
  font-size: 1.1rem;
  text-align: center;
  color: var(--amber);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 20px;
  font-weight: 500;
}

/* Selector pills */
.selector-group { margin-bottom: 16px; }
.selector-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.pill-row {
  display: flex;
  gap: 0;
  background: var(--bg2);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid #2a2a2a;
}
.pill-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--sans);
  font-size: 0.82rem;
  padding: 10px 6px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pill-btn.active {
  background: var(--bg3);
  color: var(--amber);
  box-shadow: inset 0 0 0 1px var(--amber-dim);
}

/* Lens selector as scrollable list */
.lens-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #2a2a2a;
  overflow: hidden;
  max-height: 220px;
  overflow-y: auto;
}
.lens-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--sans);
  font-size: 0.8rem;
  padding: 10px 14px;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lens-btn .mount-tag {
  font-size: 0.65rem;
  color: var(--amber-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  flex-shrink: 0;
  margin-left: 8px;
}
.lens-btn.active {
  background: var(--bg3);
  color: var(--amber);
}

/* Zoom slider */
.zoom-container {
  margin-top: 8px;
  padding: 10px 14px;
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #2a2a2a;
  display: none;
}
.zoom-container.visible { display: block; }
.zoom-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.zoom-value {
  font-family: var(--mono);
  color: var(--amber);
}
.zoom-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  outline: none;
}
.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--amber);
  border: 2px solid var(--bg);
  cursor: pointer;
}

/* Aperture wheel */
.wheel-section {
  margin: 24px 0;
  position: relative;
}
.wheel-wrapper {
  position: relative;
  width: 260px;
  height: 260px;
  margin: 0 auto;
}
.wheel-svg {
  width: 100%;
  height: 100%;
  touch-action: none;
}
.wheel-center-text {
  font-family: var(--mono);
  font-size: 2.2rem;
  fill: var(--amber);
  text-anchor: middle;
  dominant-baseline: central;
  font-weight: 600;
}
.wheel-center-sub {
  font-family: var(--sans);
  font-size: 0.7rem;
  fill: var(--text-dim);
  text-anchor: middle;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.wheel-tick {
  stroke: var(--text-dim);
  stroke-width: 2;
  stroke-linecap: round;
}
.wheel-tick.active {
  stroke: var(--amber);
  stroke-width: 3;
}
.wheel-tick-label {
  font-family: var(--mono);
  font-size: 0.65rem;
  fill: var(--text-dim);
  text-anchor: middle;
  dominant-baseline: central;
  transition: fill 0.2s;
}
.wheel-tick-label.active {
  fill: var(--amber);
  font-weight: 700;
  font-size: 0.75rem;
}
.wheel-ring {
  fill: none;
  stroke: #2a2a2a;
  stroke-width: 28;
}
.wheel-ring-active {
  fill: none;
  stroke: var(--bg3);
  stroke-width: 28;
  stroke-linecap: round;
}
.wheel-indicator {
  fill: var(--amber);
}
.wheel-arrows {
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: absolute;
  top: 50%;
  left: -10px;
  right: -10px;
  transform: translateY(-50%);
  pointer-events: none;
}
.arrow-btn {
  pointer-events: all;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid #2a2a2a;
  background: var(--bg2);
  color: var(--amber);
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
}
.arrow-btn:active { background: var(--bg3); }

/* Readout panels */
.panels { display: flex; flex-direction: column; gap: 10px; }
.panel {
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #2a2a2a;
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
}
.panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--amber-dim), transparent);
}
.panel-title {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.panel-line {
  font-family: var(--mono);
  font-size: 0.95rem;
  color: var(--text);
  margin-bottom: 4px;
  transition: opacity 0.3s;
}
.panel-line .val {
  color: var(--amber);
  font-weight: 600;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }
</style>
</head>
<body>
<div class="container">
  <h1>Scherptediepte</h1>

  <!-- Camera body selector -->
  <div class="selector-group">
    <div class="selector-label">Camera</div>
    <div class="pill-row" id="bodySelector"></div>
  </div>

  <!-- Lens selector -->
  <div class="selector-group">
    <div class="selector-label">Objectief</div>
    <div class="lens-list" id="lensSelector"></div>
  </div>

  <!-- Zoom slider -->
  <div class="zoom-container" id="zoomContainer">
    <div class="zoom-label">
      <span>Brandpuntsafstand</span>
      <span class="zoom-value" id="zoomValue">24 mm</span>
    </div>
    <input type="range" class="zoom-slider" id="zoomSlider">
  </div>

  <!-- Aperture wheel -->
  <div class="wheel-section">
    <div class="wheel-wrapper" id="wheelWrapper">
      <svg class="wheel-svg" id="wheelSvg" viewBox="0 0 260 260"></svg>
      <div class="wheel-arrows">
        <button class="arrow-btn" id="arrowLeft">‹</button>
        <button class="arrow-btn" id="arrowRight">›</button>
      </div>
    </div>
  </div>

  <!-- Readout panels -->
  <div class="panels">
    <div class="panel">
      <div class="panel-title">Hyperfocale afstand</div>
      <div class="panel-line" id="hyper1"></div>
      <div class="panel-line" id="hyper2"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Scherpstelling op 2 m</div>
      <div class="panel-line" id="focus2"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Scherpstelling op 1 m</div>
      <div class="panel-line" id="focus1"></div>
    </div>
  </div>
</div>

<script>
// ── Data ──
const ALL_STOPS = [1.0, 1.2, 1.4, 1.8, 2.0, 2.8, 4, 5.6, 8, 11, 16, 22];

const bodies = [
  { name: 'Nikon Z6 III', coc: 0.030 },
  { name: 'Nikon D700', coc: 0.030 }
];

const lenses = {
  'Nikon Z6 III': [
    { name: 'Laowa 11mm f/4', mount: 'Z', focal: 11, maxAp: 4 },
    { name: 'Nikkor Z 24–120mm f/4', mount: 'Z', focal: [24,120], maxAp: 4 },
    { name: 'Nikkor Z 100–400mm f/4.5–5.6', mount: 'Z', focal: [100,400], maxAp: [4.5, 6.3] },
    { name: 'Nikkor 35mm f/1.4G', mount: 'F', focal: 35, maxAp: 1.4 },
    { name: 'Nikkor 35mm f/2 AI', mount: 'F', focal: 35, maxAp: 2.0 },
    { name: 'Nikkor 50mm f/1.4 AI', mount: 'F', focal: 50, maxAp: 1.4 },
    { name: 'Nikkor 85mm f/2 AI', mount: 'F', focal: 85, maxAp: 2.0 },
    { name: 'Orestegon 29mm f/2.8', mount: 'M42', focal: 29, maxAp: 2.8 }
  ],
  'Nikon D700': [
    { name: 'Nikkor 35mm f/1.4G', mount: 'F', focal: 35, maxAp: 1.4 },
    { name: 'Nikkor 35mm f/2 AI', mount: 'F', focal: 35, maxAp: 2.0 },
    { name: 'Nikkor 50mm f/1.4 AI', mount: 'F', focal: 50, maxAp: 1.4 },
    { name: 'Nikkor 85mm f/2 AI', mount: 'F', focal: 85, maxAp: 2.0 },
    { name: 'Orestegon 29mm f/2.8', mount: 'M42', focal: 29, maxAp: 2.8 }
  ]
};

// ── State ──
let currentBody = 0;
let currentLens = 0;
let currentStopIndex = 0;
let availableStops = [];
let currentFocal = 0;
let currentMaxAp = 0;
let dragAngleStart = null;
let dragStopStart = null;

// ── DOM refs ──
const bodySelector = document.getElementById('bodySelector');
const lensSelector = document.getElementById('lensSelector');
const zoomContainer = document.getElementById('zoomContainer');
const zoomSlider = document.getElementById('zoomSlider');
const zoomValue = document.getElementById('zoomValue');
const wheelSvg = document.getElementById('wheelSvg');
const wheelWrapper = document.getElementById('wheelWrapper');

// ── Init ──
function init() {
  renderBodies();
  selectBody(0);
}

function renderBodies() {
  bodySelector.innerHTML = bodies.map((b, i) =>
    `<button class="pill-btn${i === currentBody ? ' active' : ''}" data-i="${i}">${b.name}</button>`
  ).join('');
  bodySelector.querySelectorAll('.pill-btn').forEach(btn => {
    btn.addEventListener('click', () => selectBody(+btn.dataset.i));
  });
}

function selectBody(i) {
  currentBody = i;
  bodySelector.querySelectorAll('.pill-btn').forEach((b, j) => b.classList.toggle('active', j === i));
  currentLens = 0;
  renderLenses();
  selectLens(0);
}

function renderLenses() {
  const list = lenses[bodies[currentBody].name];
  lensSelector.innerHTML = list.map((l, i) =>
    `<button class="lens-btn${i === currentLens ? ' active' : ''}" data-i="${i}">
      <span>${l.name}</span>
      <span class="mount-tag">${l.mount}</span>
    </button>`
  ).join('');
  lensSelector.querySelectorAll('.lens-btn').forEach(btn => {
    btn.addEventListener('click', () => selectLens(+btn.dataset.i));
  });
}

function selectLens(i) {
  currentLens = i;
  lensSelector.querySelectorAll('.lens-btn').forEach((b, j) => b.classList.toggle('active', j === i));
  const lens = lenses[bodies[currentBody].name][i];
  const isZoom = Array.isArray(lens.focal);

  if (isZoom) {
    zoomContainer.classList.add('visible');
    zoomSlider.min = lens.focal[0];
    zoomSlider.max = lens.focal[1];
    zoomSlider.value = lens.focal[0];
    currentFocal = lens.focal[0];
    updateZoomDisplay();
  } else {
    zoomContainer.classList.remove('visible');
    currentFocal = lens.focal;
  }

  updateMaxAperture();
  updateAvailableStops();
  renderWheel();
  calculate();
}

function updateMaxAperture() {
  const lens = lenses[bodies[currentBody].name][currentLens];
  if (Array.isArray(lens.maxAp)) {
    // Interpolate linearly on log scale
    const [fMin, fMax] = lens.focal;
    const [apMin, apMax] = lens.maxAp;
    const t = Math.log(currentFocal / fMin) / Math.log(fMax / fMin);
    currentMaxAp = apMin * Math.pow(apMax / apMin, t);
  } else {
    currentMaxAp = lens.maxAp;
  }
}

function updateZoomDisplay() {
  zoomValue.textContent = currentFocal + ' mm';
}

function updateAvailableStops() {
  availableStops = ALL_STOPS.filter(s => s >= currentMaxAp - 0.01);
  // Clamp current stop
  if (currentStopIndex >= availableStops.length) currentStopIndex = availableStops.length - 1;
  if (currentStopIndex < 0) currentStopIndex = 0;
}

// Zoom slider
zoomSlider.addEventListener('input', () => {
  currentFocal = +zoomSlider.value;
  updateZoomDisplay();
  updateMaxAperture();
  updateAvailableStops();
  renderWheel();
  calculate();
});

// ── Aperture Wheel ──
function renderWheel() {
  const cx = 130, cy = 130, r = 100;
  const count = availableStops.length;
  const arcSpan = Math.min(count * 25, 240); // degrees of arc used
  const startAngle = -90 - arcSpan / 2;
  const stepAngle = count > 1 ? arcSpan / (count - 1) : 0;

  let svg = '';

  // Background ring
  const bgStart = startAngle - 10;
  const bgEnd = startAngle + arcSpan + 10;
  svg += describeArc(cx, cy, r, bgStart, bgEnd, 'wheel-ring');

  // Tick marks and labels
  availableStops.forEach((stop, i) => {
    const angle = startAngle + i * stepAngle;
    const rad = angle * Math.PI / 180;
    const isActive = i === currentStopIndex;

    // Tick
    const x1 = cx + (r - 16) * Math.cos(rad);
    const y1 = cy + (r - 16) * Math.sin(rad);
    const x2 = cx + (r + 16) * Math.cos(rad);
    const y2 = cy + (r + 16) * Math.sin(rad);
    svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="wheel-tick${isActive ? ' active' : ''}"/>`;

    // Label
    const lr = r + 28;
    const lx = cx + lr * Math.cos(rad);
    const ly = cy + lr * Math.sin(rad);
    const label = stop % 1 === 0 ? stop : stop.toFixed(1);
    svg += `<text x="${lx}" y="${ly}" class="wheel-tick-label${isActive ? ' active' : ''}" data-i="${i}">${label}</text>`;
  });

  // Active indicator dot
  if (count > 0) {
    const activeAngle = startAngle + currentStopIndex * stepAngle;
    const arad = activeAngle * Math.PI / 180;
    const dx = cx + (r) * Math.cos(arad);
    const dy = cy + (r) * Math.sin(arad);
    svg += `<circle cx="${dx}" cy="${dy}" r="5" class="wheel-indicator"/>`;
  }

  // Center text
  const apVal = availableStops[currentStopIndex];
  const apText = apVal % 1 === 0 ? `f/${apVal}` : `f/${apVal.toFixed(1)}`;
  svg += `<text x="${cx}" y="${cy - 8}" class="wheel-center-text">${apText}</text>`;
  svg += `<text x="${cx}" y="${cy + 18}" class="wheel-center-sub">diafragma</text>`;

  wheelSvg.innerHTML = svg;

  // Click on labels
  wheelSvg.querySelectorAll('.wheel-tick-label').forEach(el => {
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => {
      currentStopIndex = +el.dataset.i;
      renderWheel();
      calculate();
    });
  });
}

function describeArc(cx, cy, r, startAngle, endAngle, cls) {
  const s = startAngle * Math.PI / 180;
  const e = endAngle * Math.PI / 180;
  const x1 = cx + r * Math.cos(s);
  const y1 = cy + r * Math.sin(s);
  const x2 = cx + r * Math.cos(e);
  const y2 = cy + r * Math.sin(e);
  const large = (endAngle - startAngle) > 180 ? 1 : 0;
  return `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2}" class="${cls}"/>`;
}

// Arrow buttons
document.getElementById('arrowLeft').addEventListener('click', () => {
  if (currentStopIndex > 0) {
    currentStopIndex--;
    renderWheel();
    calculate();
  }
});
document.getElementById('arrowRight').addEventListener('click', () => {
  if (currentStopIndex < availableStops.length - 1) {
    currentStopIndex++;
    renderWheel();
    calculate();
  }
});

// Touch/mouse drag on wheel
(function() {
  const svg = wheelSvg;

  function getAngle(e) {
    const rect = svg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI;
  }

  function onStart(e) {
    dragAngleStart = getAngle(e);
    dragStopStart = currentStopIndex;
    e.preventDefault();
  }

  function onMove(e) {
    if (dragAngleStart === null) return;
    const angle = getAngle(e);
    let delta = angle - dragAngleStart;
    // Normalize
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    const count = availableStops.length;
    const arcSpan = Math.min(count * 25, 240);
    const stepAngle = count > 1 ? arcSpan / (count - 1) : 1;
    const stepsChange = Math.round(delta / stepAngle);
    let newIndex = dragStopStart + stepsChange;
    newIndex = Math.max(0, Math.min(availableStops.length - 1, newIndex));

    if (newIndex !== currentStopIndex) {
      currentStopIndex = newIndex;
      renderWheel();
      calculate();
    }
    e.preventDefault();
  }

  function onEnd() {
    dragAngleStart = null;
    dragStopStart = null;
  }

  svg.addEventListener('mousedown', onStart);
  svg.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
})();

// ── DOF Calculations ──
function calculate() {
  const coc = bodies[currentBody].coc;
  const f = currentFocal; // mm
  const N = availableStops[currentStopIndex];

  // Hyperfocal distance H in mm, then convert to m
  const H_mm = (f * f) / (N * coc) + f;
  const H = H_mm / 1000; // meters

  // Hyperfocal panel
  document.getElementById('hyper1').innerHTML =
    `Stel scherp op <span class="val">${H.toFixed(2)} m</span>`;
  document.getElementById('hyper2').innerHTML =
    `Scherp van <span class="val">${(H / 2).toFixed(2)} m</span> tot <span class="val">∞</span>`;

  // Focus at 2m
  document.getElementById('focus2').innerHTML = dofLine(H, 2);

  // Focus at 1m
  document.getElementById('focus1').innerHTML = dofLine(H, 1);
}

function dofLine(H, d) {
  const near = (H * d) / (H + d);
  let far;
  if (d >= H) {
    far = '∞';
  } else {
    const farVal = (H * d) / (H - d);
    far = farVal >= H ? '∞' : farVal.toFixed(2) + ' m';
  }
  return `Scherp van <span class="val">${near.toFixed(2)} m</span> tot <span class="val">${far}</span>`;
}

// ── Service Worker ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

// ── Start ──
init();
</script>
</body>
</html>
