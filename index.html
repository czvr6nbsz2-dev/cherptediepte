<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ScD Calc">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Scherptediepte Calculator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0e0e;
  --bg2: #1a1a1a;
  --bg3: #242424;
  --amber: #c8922a;
  --amber-dim: #8a6520;
  --text: #e8e0d4;
  --text-dim: #8a8278;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Menlo', 'Consolas', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --radius: 10px;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.3;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overflow-x: hidden;
  height: 100dvh;
  overflow-y: hidden;
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 8px 12px 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

h1 {
  font-size: 0.85rem;
  text-align: center;
  color: var(--amber);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 8px;
  font-weight: 500;
  flex-shrink: 0;
}

/* Selector group */
.selector-group { margin-bottom: 8px; flex-shrink: 0; }
.selector-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  margin-bottom: 4px;
}

/* Lens selector */
.lens-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #2a2a2a;
  overflow: hidden;
  max-height: 160px;
  overflow-y: auto;
}
.lens-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--sans);
  font-size: 0.85rem;
  padding: 8px 10px;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lens-btn .mount-tag {
  font-size: 0.6rem;
  color: var(--amber-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  flex-shrink: 0;
  margin-left: 6px;
}
.lens-btn.active {
  background: var(--bg3);
  color: var(--amber);
}

/* Zoom slider */
.zoom-container {
  margin-top: 6px;
  padding: 7px 10px;
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #2a2a2a;
  display: none;
}
.zoom-container.visible { display: block; }
.zoom-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}
.zoom-value {
  font-family: var(--mono);
  color: var(--amber);
}
.zoom-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  outline: none;
}
.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--amber);
  border: 2px solid var(--bg);
  cursor: pointer;
}

/* Horizontal strips (aperture + distance) */
.strip-section {
  margin: 6px 0;
  flex-shrink: 0;
}
.strip-header {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  margin-bottom: 4px;
}
.strip-value {
  font-family: var(--mono);
  font-size: 1.4rem;
  color: var(--amber);
  font-weight: 600;
}
.strip-label {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
}
.strip-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.strip-container {
  flex: 1;
  overflow: hidden;
  position: relative;
  height: 46px;
  touch-action: none;
}
.strip-track {
  position: absolute;
  top: 0;
  height: 100%;
  display: flex;
  align-items: center;
  transition: transform 0.15s ease-out;
  will-change: transform;
}
.strip-stop {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 48px;
  flex-shrink: 0;
  cursor: pointer;
  height: 100%;
}
.strip-tick {
  width: 2px;
  height: 16px;
  background: var(--text-dim);
  border-radius: 1px;
  transition: all 0.15s;
}
.strip-stop.active .strip-tick {
  background: var(--amber);
  height: 22px;
  width: 3px;
}
.strip-stop-label {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--text-dim);
  margin-top: 2px;
  transition: all 0.15s;
  white-space: nowrap;
}
.strip-stop.active .strip-stop-label {
  color: var(--amber);
  font-weight: 700;
  font-size: 0.66rem;
}
.strip-container::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--amber);
  z-index: 2;
  opacity: 0.4;
  transform: translateX(-50%);
}
.arrow-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid #2a2a2a;
  background: var(--bg2);
  color: var(--amber);
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
  flex-shrink: 0;
}
.arrow-btn:active { background: var(--bg3); }

/* Readout panels */
.panels {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
  min-height: 0;
}
.panel {
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #2a2a2a;
  padding: 7px 10px;
  position: relative;
  overflow: hidden;
}
.panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--amber-dim), transparent);
}
.panel-title {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 3px;
}
.panel-line {
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--text);
  margin-bottom: 1px;
  transition: opacity 0.3s;
}
.panel-line .val {
  color: var(--amber);
  font-weight: 600;
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }
</style>
</head>
<body>
<div class="container">
  <h1>Scherptediepte</h1>

  <!-- Lens selector -->
  <div class="selector-group">
    <div class="selector-label">Objectief</div>
    <div class="lens-list" id="lensSelector"></div>
  </div>

  <!-- Zoom slider -->
  <div class="zoom-container" id="zoomContainer">
    <div class="zoom-label">
      <span>Brandpuntsafstand</span>
      <span class="zoom-value" id="zoomValue">24 mm</span>
    </div>
    <input type="range" class="zoom-slider" id="zoomSlider">
  </div>

  <!-- Aperture strip -->
  <div class="strip-section">
    <div class="strip-header">
      <span class="strip-value" id="apertureValue">f/4</span>
      <span class="strip-label">diafragma</span>
    </div>
    <div class="strip-row">
      <button class="arrow-btn" id="apLeft">‹</button>
      <div class="strip-container" id="apContainer">
        <div class="strip-track" id="apTrack"></div>
      </div>
      <button class="arrow-btn" id="apRight">›</button>
    </div>
  </div>

  <!-- Focus distance strip -->
  <div class="strip-section">
    <div class="strip-header">
      <span class="strip-value" id="distValue">5.0 m</span>
      <span class="strip-label">scherpstelafstand</span>
    </div>
    <div class="strip-row">
      <button class="arrow-btn" id="distLeft">‹</button>
      <div class="strip-container" id="distContainer">
        <div class="strip-track" id="distTrack"></div>
      </div>
      <button class="arrow-btn" id="distRight">›</button>
    </div>
  </div>

  <!-- Readout panels -->
  <div class="panels">
    <div class="panel">
      <div class="panel-title">Hyperfocale afstand</div>
      <div class="panel-line" id="hyper1"></div>
      <div class="panel-line" id="hyper2"></div>
    </div>
    <div class="panel">
      <div class="panel-title" id="customTitle">Scherpstelling op 5.0 m</div>
      <div class="panel-line" id="focusCustom"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Scherpstelling 5 m</div>
      <div class="panel-line" id="focus5"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Scherpstelling 2 m</div>
      <div class="panel-line" id="focus2"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Scherpstelling 1 m</div>
      <div class="panel-line" id="focus1"></div>
    </div>
  </div>
</div>

<script>
const COC = 0.030;
const ALL_STOPS = [1.0, 1.2, 1.4, 1.8, 2.0, 2.8, 4, 5.6, 8, 11, 16, 22];
const DIST_STOPS = [0.3, 0.5, 0.7, 1, 1.5, 2, 3, 5, 7, 10, 15, 20, 30, 50, 100];
const STOP_WIDTH = 48;

const allLenses = [
  { name: 'Laowa 11mm f/4', mount: 'Z', focal: 11, maxAp: 4 },
  { name: 'Nikkor Z 24–120mm f/4', mount: 'Z', focal: [24,120], maxAp: 4 },
  { name: 'Nikkor Z 100–400mm f/4.5–5.6', mount: 'Z', focal: [100,400], maxAp: [4.5, 6.3] },
  { name: 'Orestegon 29mm f/2.8', mount: 'M42', focal: 29, maxAp: 2.8 },
  { name: 'Nikkor 35mm f/1.4G', mount: 'F', focal: 35, maxAp: 1.4 },
  { name: 'Nikkor 35mm f/2 AI', mount: 'F', focal: 35, maxAp: 2.0 },
  { name: 'Nikkor 50mm f/1.4 AI', mount: 'F', focal: 50, maxAp: 1.4 },
  { name: 'Nikkor 85mm f/2 AI', mount: 'F', focal: 85, maxAp: 2.0 },
];

let currentLens = 0;
let currentStopIndex = 0;
let currentDistIndex = 5; // 2m
let availableStops = [];
let currentFocal = 0;
let currentMaxAp = 0;

// ── DOM refs ──
const lensSelector = document.getElementById('lensSelector');
const zoomContainer = document.getElementById('zoomContainer');
const zoomSlider = document.getElementById('zoomSlider');
const zoomValue = document.getElementById('zoomValue');
const apContainer = document.getElementById('apContainer');
const apTrack = document.getElementById('apTrack');
const apertureValue = document.getElementById('apertureValue');
const distContainer = document.getElementById('distContainer');
const distTrack = document.getElementById('distTrack');
const distValue = document.getElementById('distValue');

// ── Init ──
function init() {
  renderLenses();
  selectLens(0);
  renderDistStrip();
}

function renderLenses() {
  lensSelector.innerHTML = allLenses.map((l, i) =>
    `<button class="lens-btn${i === currentLens ? ' active' : ''}" data-i="${i}">
      <span>${l.name}</span>
      <span class="mount-tag">${l.mount}</span>
    </button>`
  ).join('');
  lensSelector.querySelectorAll('.lens-btn').forEach(btn => {
    btn.addEventListener('click', () => selectLens(+btn.dataset.i));
  });
}

function selectLens(i) {
  currentLens = i;
  lensSelector.querySelectorAll('.lens-btn').forEach((b, j) => b.classList.toggle('active', j === i));
  const lens = allLenses[i];
  const isZoom = Array.isArray(lens.focal);

  if (isZoom) {
    zoomContainer.classList.add('visible');
    zoomSlider.min = lens.focal[0];
    zoomSlider.max = lens.focal[1];
    zoomSlider.value = lens.focal[0];
    currentFocal = lens.focal[0];
    updateZoomDisplay();
  } else {
    zoomContainer.classList.remove('visible');
    currentFocal = lens.focal;
  }

  updateMaxAperture();
  updateAvailableStops();
  renderApStrip();
  calculate();
}

function updateMaxAperture() {
  const lens = allLenses[currentLens];
  if (Array.isArray(lens.maxAp)) {
    const [fMin, fMax] = lens.focal;
    const [apMin, apMax] = lens.maxAp;
    const t = Math.log(currentFocal / fMin) / Math.log(fMax / fMin);
    currentMaxAp = apMin * Math.pow(apMax / apMin, t);
  } else {
    currentMaxAp = lens.maxAp;
  }
}

function updateZoomDisplay() {
  zoomValue.textContent = currentFocal + ' mm';
}

function updateAvailableStops() {
  availableStops = ALL_STOPS.filter(s => s >= currentMaxAp - 0.01);
  if (currentStopIndex >= availableStops.length) currentStopIndex = availableStops.length - 1;
  if (currentStopIndex < 0) currentStopIndex = 0;
}

zoomSlider.addEventListener('input', () => {
  currentFocal = +zoomSlider.value;
  updateZoomDisplay();
  updateMaxAperture();
  updateAvailableStops();
  renderApStrip();
  calculate();
});

// ── Generic strip helper ──
function setupStrip(container, track, stops, getIndex, setIndex, formatLabel, formatValue, valueEl, onUpdate) {
  function render() {
    const idx = getIndex();
    track.innerHTML = stops.map((s, i) => {
      const label = formatLabel(s);
      return `<div class="strip-stop${i === idx ? ' active' : ''}" data-i="${i}">
        <div class="strip-tick"></div>
        <div class="strip-stop-label">${label}</div>
      </div>`;
    }).join('');
    track.querySelectorAll('.strip-stop').forEach(el => {
      el.addEventListener('click', () => { setIndex(+el.dataset.i); render(); onUpdate(); });
    });
    updatePos(false);
    valueEl.textContent = formatValue(stops[idx]);
  }

  function updatePos(animate) {
    const w = container.offsetWidth;
    const offset = w / 2 - getIndex() * STOP_WIDTH - STOP_WIDTH / 2;
    track.style.transition = animate ? 'transform 0.15s ease-out' : 'none';
    track.style.transform = `translateX(${offset}px)`;
  }

  // Drag
  let dragX = null, dragStart = null;
  function getX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }

  container.addEventListener('mousedown', onStart);
  container.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);

  function onStart(e) { dragX = getX(e); dragStart = getIndex(); track.style.transition = 'none'; e.preventDefault(); }
  function onMove(e) {
    if (dragX === null) return;
    const dx = getX(e) - dragX;
    const steps = Math.round(-dx / STOP_WIDTH);
    let ni = Math.max(0, Math.min(stops.length - 1, dragStart + steps));
    if (ni !== getIndex()) {
      setIndex(ni);
      track.querySelectorAll('.strip-stop').forEach((s, i) => s.classList.toggle('active', i === ni));
      updatePos(false);
      valueEl.textContent = formatValue(stops[ni]);
      onUpdate();
    }
    e.preventDefault();
  }
  function onEnd() { if (dragX !== null) updatePos(true); dragX = null; dragStart = null; }

  return { render, updatePos };
}

// ── Aperture strip ──
const apStrip = setupStrip(
  apContainer, apTrack,
  [], // placeholder, replaced on render
  () => currentStopIndex,
  i => { currentStopIndex = i; },
  s => s % 1 === 0 ? s : s.toFixed(1),
  s => s % 1 === 0 ? `f/${s}` : `f/${s.toFixed(1)}`,
  apertureValue,
  calculate
);

function renderApStrip() {
  // Re-create with current available stops
  const idx = currentStopIndex;
  apTrack.innerHTML = availableStops.map((s, i) => {
    const label = s % 1 === 0 ? s : s.toFixed(1);
    return `<div class="strip-stop${i === idx ? ' active' : ''}" data-i="${i}">
      <div class="strip-tick"></div>
      <div class="strip-stop-label">${label}</div>
    </div>`;
  }).join('');
  apTrack.querySelectorAll('.strip-stop').forEach(el => {
    el.addEventListener('click', () => {
      currentStopIndex = +el.dataset.i;
      renderApStrip();
      calculate();
    });
  });
  updateApPos(false);
  const v = availableStops[currentStopIndex];
  apertureValue.textContent = v % 1 === 0 ? `f/${v}` : `f/${v.toFixed(1)}`;
}

function updateApPos(animate) {
  const w = apContainer.offsetWidth;
  const offset = w / 2 - currentStopIndex * STOP_WIDTH - STOP_WIDTH / 2;
  apTrack.style.transition = animate ? 'transform 0.15s ease-out' : 'none';
  apTrack.style.transform = `translateX(${offset}px)`;
}

// Aperture arrows
document.getElementById('apLeft').addEventListener('click', () => {
  if (currentStopIndex > 0) { currentStopIndex--; renderApStrip(); updateApPos(true); calculate(); }
});
document.getElementById('apRight').addEventListener('click', () => {
  if (currentStopIndex < availableStops.length - 1) { currentStopIndex++; renderApStrip(); updateApPos(true); calculate(); }
});

// Aperture drag
(function() {
  let dragX = null, dragStart = null;
  function getX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }
  apContainer.addEventListener('mousedown', e => { dragX = getX(e); dragStart = currentStopIndex; apTrack.style.transition = 'none'; e.preventDefault(); });
  apContainer.addEventListener('touchstart', e => { dragX = getX(e); dragStart = currentStopIndex; apTrack.style.transition = 'none'; e.preventDefault(); }, { passive: false });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  function onMove(e) {
    if (dragX === null) return;
    const dx = getX(e) - dragX;
    let ni = Math.max(0, Math.min(availableStops.length - 1, dragStart + Math.round(-dx / STOP_WIDTH)));
    if (ni !== currentStopIndex) {
      currentStopIndex = ni;
      apTrack.querySelectorAll('.strip-stop').forEach((s, i) => s.classList.toggle('active', i === ni));
      updateApPos(false);
      const v = availableStops[ni];
      apertureValue.textContent = v % 1 === 0 ? `f/${v}` : `f/${v.toFixed(1)}`;
      calculate();
    }
    e.preventDefault();
  }
  function onEnd() { if (dragX !== null) updateApPos(true); dragX = null; }
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
})();

// ── Distance strip ──
function formatDist(d) { return d >= 1 ? (d % 1 === 0 ? d + '' : d.toFixed(1)) : d.toFixed(1); }
function formatDistValue(d) { return formatDist(d) + ' m'; }

function renderDistStrip() {
  const idx = currentDistIndex;
  distTrack.innerHTML = DIST_STOPS.map((d, i) => {
    return `<div class="strip-stop${i === idx ? ' active' : ''}" data-i="${i}">
      <div class="strip-tick"></div>
      <div class="strip-stop-label">${formatDist(d)}</div>
    </div>`;
  }).join('');
  distTrack.querySelectorAll('.strip-stop').forEach(el => {
    el.addEventListener('click', () => {
      currentDistIndex = +el.dataset.i;
      renderDistStrip();
      calculate();
    });
  });
  updateDistPos(false);
  distValue.textContent = formatDistValue(DIST_STOPS[currentDistIndex]);
}

function updateDistPos(animate) {
  const w = distContainer.offsetWidth;
  const offset = w / 2 - currentDistIndex * STOP_WIDTH - STOP_WIDTH / 2;
  distTrack.style.transition = animate ? 'transform 0.15s ease-out' : 'none';
  distTrack.style.transform = `translateX(${offset}px)`;
}

// Distance arrows
document.getElementById('distLeft').addEventListener('click', () => {
  if (currentDistIndex > 0) { currentDistIndex--; renderDistStrip(); updateDistPos(true); calculate(); }
});
document.getElementById('distRight').addEventListener('click', () => {
  if (currentDistIndex < DIST_STOPS.length - 1) { currentDistIndex++; renderDistStrip(); updateDistPos(true); calculate(); }
});

// Distance drag
(function() {
  let dragX = null, dragStart = null;
  function getX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }
  distContainer.addEventListener('mousedown', e => { dragX = getX(e); dragStart = currentDistIndex; distTrack.style.transition = 'none'; e.preventDefault(); });
  distContainer.addEventListener('touchstart', e => { dragX = getX(e); dragStart = currentDistIndex; distTrack.style.transition = 'none'; e.preventDefault(); }, { passive: false });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  function onMove(e) {
    if (dragX === null) return;
    const dx = getX(e) - dragX;
    let ni = Math.max(0, Math.min(DIST_STOPS.length - 1, dragStart + Math.round(-dx / STOP_WIDTH)));
    if (ni !== currentDistIndex) {
      currentDistIndex = ni;
      distTrack.querySelectorAll('.strip-stop').forEach((s, i) => s.classList.toggle('active', i === ni));
      updateDistPos(false);
      distValue.textContent = formatDistValue(DIST_STOPS[ni]);
      calculate();
    }
    e.preventDefault();
  }
  function onEnd() { if (dragX !== null) updateDistPos(true); dragX = null; }
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
})();

// ── DOF Calculations ──
function calculate() {
  const f = currentFocal;
  const N = availableStops[currentStopIndex];
  const H_mm = (f * f) / (N * COC) + f;
  const H = H_mm / 1000;

  document.getElementById('hyper1').innerHTML =
    `Stel scherp op <span class="val">${H.toFixed(2)} m</span>`;
  document.getElementById('hyper2').innerHTML =
    `Scherp van <span class="val">${(H / 2).toFixed(2)} m</span> tot <span class="val">∞</span>`;

  const customDist = DIST_STOPS[currentDistIndex];
  document.getElementById('customTitle').textContent = `Scherpstelling op ${formatDistValue(customDist)}`;
  document.getElementById('focusCustom').innerHTML = dofLine(H, customDist);

  document.getElementById('focus5').innerHTML = dofLine(H, 5);
  document.getElementById('focus2').innerHTML = dofLine(H, 2);
  document.getElementById('focus1').innerHTML = dofLine(H, 1);
}

function dofLine(H, d) {
  const near = (H * d) / (H + d);
  let far;
  if (d >= H) {
    far = '∞';
  } else {
    const farVal = (H * d) / (H - d);
    far = farVal >= H ? '∞' : farVal.toFixed(2) + ' m';
  }
  return `<span class="val">${near.toFixed(2)} m</span> – <span class="val">${far}</span>`;
}

// ── Service Worker ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

// ── Start ──
init();
requestAnimationFrame(() => { updateApPos(false); updateDistPos(false); });
